name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-python@v2
        with:
          python-version: 3.11

      - name: Install Zensical and ghp-import
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          source $HOME/.cargo/env
          uv venv --python 3.11
          uv pip install "zensical==0.0.67" "ghp-import==2.1.0"

      - name: Build documentation
        run: uv run zensical build --clean

      - name: Publish generated site to gh-pages
        if: github.event_name == 'push'
        run: uv run ghp-import --no-jekyll --push --force site

      - name: Check out published pages
        if: github.event_name == 'push'
        uses: actions/checkout@v2
        with:
          ref: gh-pages

      - name: Commit pages without compression
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "pages without compression"
          branch: gh-pages
          push_options: '--force'

      - name: Set up Node
        if: github.event_name == 'push'
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install compression dependencies
        if: github.event_name == 'push'
        run: |
          npm install
          npm install -g gzipper@7.2.0

      - name: Compress published pages
        if: github.event_name == 'push'
        run: gzipper compress --include htm,html,css,js,svg,xml,map,json,img,png,jpg,jpeg --zopfli --brotli --remove-larger .

      - name: Commit compressed pages
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "pages with compression"
          branch: gh-pages
          push_options: '--force'
